<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forever World 3D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="panel left">
        <h1>Forever World 3D</h1>
        <div class="stats">
          <div><span>Health</span><strong id="health">100 / 100</strong></div>
          <div><span>Attack</span><strong id="attack">12</strong></div>
          <div><span>Defense</span><strong id="defense">6</strong></div>
          <div><span>Wood</span><strong id="wood">0</strong></div>
          <div><span>Stone</span><strong id="stone">0</strong></div>
          <div><span>Food</span><strong id="food">4</strong></div>
          <div><span>Gold</span><strong id="gold">0</strong></div>
          <div><span>Walls</span><strong id="walls">0</strong></div>
          <div><span>Score</span><strong id="score">0 / 12</strong></div>
        </div>
        <div class="controls">
          <button id="restartBtn">Restart</button>
          <button id="buildBtn">Build Mode: Off</button>
        </div>
      </div>

      <div id="messageBox">Collect resources, survive, and win.</div>
      <div id="crosshair"></div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
